{% extends "base.html" %}

{% block title %}Verify - Face Checkpoint{% endblock %}

{% block content %}
<div class="text-center">
    <h2>Biometric Security Checkpoint</h2>
    <p class="muted" style="margin-bottom: 20px;">Face-only verification mode is active. Position your face clearly and scan.</p>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement"></canvas>

    <button id="captureBtn" onclick="verifyFace()" style="background: var(--warning);">Scan Live Face</button>
    <button id="retryBtn" onclick="location.reload()" style="display:none; background: var(--text-muted);">Process Next Passenger</button>

    <div id="result-box" style="display:none; margin-top: 25px;"></div>
</div>

<script>
    let video = document.getElementById('videoElement');
    let canvas = document.getElementById('canvasElement');

    async function startFaceCamera() {
        try {
            let stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.style.display = 'block';
        } catch (err) {
            alert("Camera access denied!");
        }
    }

    async function verifyFace() {
        let captureBtn = document.getElementById('captureBtn');
        let resultBox = document.getElementById('result-box');
        
        captureBtn.innerText = "Processing...";
        captureBtn.disabled = true;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        let ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        let imageBase64Data = canvas.toDataURL('image/jpeg', 0.9);
        
        let stream = video.srcObject;
        let tracks = stream.getTracks();
        tracks.forEach(track => track.stop());
        video.style.display = "none";
        canvas.style.display = "block";
        
        let formData = new FormData();
        formData.append("image_base64", imageBase64Data);

        try {
            let response = await fetch("/api/verify_face", {
                method: "POST",
                body: formData
            });
            let result = await response.json();
            
            resultBox.style.display = "block";
            captureBtn.style.display = "none";
            document.getElementById('retryBtn').style.display = "inline-block";
            
            if(result.status === "success") {
                resultBox.className = "success";
                resultBox.innerHTML = `✅ ${result.message}<br><span style='font-size:12px; color: #1e8449;'>Passenger: ${result.name} (${result.aadhaar}) | Match Score: ${result.score}</span>`;
            } else {
                resultBox.className = "error";
                resultBox.innerHTML = `❌ ${result.message}<br><span style='font-size:12px; color: #a93226;'>Reason code/Score: ${result.score || 'None'}</span>`;
            }
        } catch (error) {
            resultBox.style.display = "block";
            resultBox.className = "error";
            resultBox.innerText = "Network Error. Please retry.";
            document.getElementById('retryBtn').style.display = "inline-block";
            captureBtn.style.display = "none";
        }
    }

    startFaceCamera();
</script>
{% endblock %}
