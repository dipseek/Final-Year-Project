{% extends "base.html" %}

{% block title %}Verify - Face Checkpoint{% endblock %}

{% block content %}
<div class="text-center">
    <h2>Biometric Security Checkpoint</h2>
    <p class="muted" style="margin-bottom: 20px;">Face-only verification mode is active. Position your face clearly and scan.</p>
    <div id="camera-error" class="error" style="display:none; margin-bottom: 15px;"></div>

    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement"></canvas>
    <input type="file" id="verifyFileUpload" accept="image/*" style="margin:10px 0;" />

    <button id="captureBtn" onclick="capturePhoto()" style="background: var(--warning);">Capture Photo</button>
    <button id="verifyNowBtn" onclick="verifyFace()" style="display:none; margin-top:10px;">Verify Now</button>
    <button id="retryBtn" onclick="location.reload()" style="display:none; background: var(--text-muted);">Process Next Passenger</button>

    <div id="result-box" style="display:none; margin-top: 25px;"></div>
</div>

<script>
    let video = document.getElementById('videoElement');
    let canvas = document.getElementById('canvasElement');
    let selectedImageBase64Data = null;
    const errorBox = document.getElementById('camera-error');
    const verifyFileUpload = document.getElementById('verifyFileUpload');
    const verifyNowBtn = document.getElementById('verifyNowBtn');

    verifyFileUpload.addEventListener('change', () => {
        const file = verifyFileUpload.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onloadend = function () {
            selectedImageBase64Data = reader.result;
            const img = new Image();
            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                canvas.style.display = 'block';
                video.style.display = 'none';
                verifyNowBtn.style.display = 'inline-block';
            };
            img.src = selectedImageBase64Data;
        };
        reader.readAsDataURL(file);
    });

    async function startFaceCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            errorBox.style.display = 'block';
            errorBox.innerText = "Camera API is not available in this browser. Upload a face image to continue.";
            return;
        }
        try {
            let stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            video.style.display = 'block';
        } catch (err) {
            errorBox.style.display = 'block';
            errorBox.innerText = "Camera access denied or blocked. Allow camera permission, or upload a face image to continue.";
        }
    }

    function capturePhoto() {
        let captureBtn = document.getElementById('captureBtn');
        let resultBox = document.getElementById('result-box');

        if (video.srcObject && video.videoWidth > 0) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            let ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            selectedImageBase64Data = canvas.toDataURL('image/jpeg', 0.9);
            verifyNowBtn.style.display = 'inline-block';
        } else {
            resultBox.style.display = "block";
            resultBox.className = "error";
            resultBox.innerText = "No camera image available. Enable webcam or upload a face image first.";
            return;
        }
        
        let stream = video.srcObject;
        if (stream) {
            let tracks = stream.getTracks();
            tracks.forEach(track => track.stop());
        }
        video.style.display = "none";
        canvas.style.display = "block";
        captureBtn.innerText = "Capture Photo";
    }

    async function verifyFace() {
        let captureBtn = document.getElementById('captureBtn');
        let resultBox = document.getElementById('result-box');

        if (!selectedImageBase64Data) {
            resultBox.style.display = "block";
            resultBox.className = "error";
            resultBox.innerText = "Please choose a file or capture a photo first.";
            return;
        }

        verifyNowBtn.innerText = "Verifying...";
        verifyNowBtn.disabled = true;
        captureBtn.disabled = true;

        let formData = new FormData();
        formData.append("image_base64", selectedImageBase64Data);

        try {
            let response = await fetch("/api/verify_face", {
                method: "POST",
                body: formData
            });
            let result = await response.json();
            
            resultBox.style.display = "block";
            captureBtn.style.display = "none";
            verifyNowBtn.style.display = "none";
            document.getElementById('retryBtn').style.display = "inline-block";
            
            if(result.status === "success") {
                resultBox.className = "success";
                resultBox.innerHTML = `✅ ${result.message}<br><span style='font-size:12px; color: #1e8449;'>Passenger: ${result.name} (${result.aadhaar}) | Match Score: ${result.score}</span>`;
            } else {
                resultBox.className = "error";
                resultBox.innerHTML = `❌ ${result.message}<br><span style='font-size:12px; color: #a93226;'>Reason code/Score: ${result.score || 'None'}</span>`;
            }
        } catch (error) {
            resultBox.style.display = "block";
            resultBox.className = "error";
            resultBox.innerText = "Network Error. Please retry.";
            document.getElementById('retryBtn').style.display = "inline-block";
            verifyNowBtn.innerText = "Verify Now";
            verifyNowBtn.disabled = false;
            captureBtn.disabled = false;
        }
    }

    startFaceCamera();
</script>
{% endblock %}
